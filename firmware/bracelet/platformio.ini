; Sola — bracelet résident
; Carte : ESP32 DevKit v1 (ajuste `board` si la tienne diffère)
;
; NimBLE remplace la pile BLE d'origine : ~100 Ko de flash en moins, ce qui
; évite le "sketch too big" avec le partitionnement par défaut.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = time

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

build_flags =
    -D CORE_DEBUG_LEVEL=0

; Décommente si la compilation dépasse malgré NimBLE :
; board_build.partitions = huge_app.csv
