; Sola — bracelet résident, version capteurs I²C
; Carte : ESP32 DevKit v1 (ajuste `board` si la tienne diffère)
;
; Variante du firmware `bracelet/` (KY-039 analogique). Celui-ci ajoute la
; SpO₂, l'activité, les chutes et l'estimation de la durée de sommeil.
; Les deux projets se compilent et se flashent indépendamment.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = time

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

build_flags =
    -D CORE_DEBUG_LEVEL=0

; Décommente si la compilation dépasse malgré NimBLE :
; board_build.partitions = huge_app.csv
