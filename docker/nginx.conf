# La console et le backoffice : des fichiers statiques, et deux règles.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Les routes de l'application — /residents/R-0448, /registre… — n'existent
    # que dans le navigateur : un chemin sans fichier rend index.html, et React
    # Router affiche l'écran. Sans cela, recharger une fiche donnerait un 404.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite met l'empreinte du contenu dans le nom de ces fichiers : sous un
    # même nom, ils ne changent jamais. index.html, lui, se revalide à chaque
    # chargement, pour qu'une nouvelle image soit servie tout de suite.
    location /assets/ {
        expires max;
    }
}
